{% extends 'base_modern.html' %}
{% load static %}

{% block title %}Verify Email - SceneVerse{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card bg-dark text-white border-secondary p-4"
        style="max-width: 400px; width: 100%; border-radius: 15px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Verify Your Email</h3>
            <p class="text-muted small">We've sent a 6-digit code to your email. Enter it below.</p>
        </div>


        <form method="POST" class="needs-validation" novalidate id="otpForm">
            {% csrf_token %}
            <div class="d-flex justify-content-between mb-4 gap-2">
                <input type="text" name="otp1"
                    class="form-control otp-input text-center bg-dark text-white border-secondary fs-4" maxlength="1"
                    required autofocus>
                <input type="text" name="otp2"
                    class="form-control otp-input text-center bg-dark text-white border-secondary fs-4" maxlength="1"
                    required>
                <input type="text" name="otp3"
                    class="form-control otp-input text-center bg-dark text-white border-secondary fs-4" maxlength="1"
                    required>
                <input type="text" name="otp4"
                    class="form-control otp-input text-center bg-dark text-white border-secondary fs-4" maxlength="1"
                    required>
                <input type="text" name="otp5"
                    class="form-control otp-input text-center bg-dark text-white border-secondary fs-4" maxlength="1"
                    required>
                <input type="text" name="otp6"
                    class="form-control otp-input text-center bg-dark text-white border-secondary fs-4" maxlength="1"
                    required>
            </div>

            <button type="submit" id="verifyBtn" class="btn btn-primary w-100 py-2 fw-bold">Verify Code</button>
            <a href="/cancel_signup/" class="btn btn-outline-danger w-100 py-2 fw-bold mt-3">Cancel Registering</a>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Didn't receive code? <a href="/resend_otp/" id="resendBtn"
                    class="text-info text-decoration-none">Resend Code</a></small>
        </div>
    </div>
</div>

<script>
    // Auto-focus next input script
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, index) => {
        input.addEventListener('input', function () {
            if (this.value.length === 1) {
                if (index < inputs.length - 1) inputs[index + 1].focus();
            }
        });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && this.value.length === 0) {
                if (index > 0) inputs[index - 1].focus();
            }
        });
    });

    // Timer Logic
    function startResendTimer(btnId, duration) {
        const btn = document.getElementById(btnId);
        if (!btn) return;

        let timer = duration;
        const originalText = btn.innerText;
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.5';

        const interval = setInterval(() => {
            btn.innerText = `Resend in ${timer}s`;
            if (--timer < 0) {
                clearInterval(interval);
                btn.innerText = originalText;
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            }
        }, 1000);
    }

    // Start timer on load
    startResendTimer('resendBtn', 30);

    // Double-click prevention
    document.getElementById('otpForm').addEventListener('submit', function() {
        const btn = document.getElementById('verifyBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';
        }
    });

    // Disable resend on click
    document.getElementById('resendBtn').addEventListener('click', function() {
        this.style.pointerEvents = 'none';
        this.style.opacity = '0.5';
        this.innerText = 'Resending...';
    });
</script>
{% endblock %}
