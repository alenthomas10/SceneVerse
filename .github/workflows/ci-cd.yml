name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./SceneVerse

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './SceneVerse/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Verification Check
        run: |
          python manage.py check

      - name: Check for Unmade Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Django Tests
        run: |
          python manage.py test

  deploy:
    name: Deploy to Cloud (Render)
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Deploy Webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment webhook..."
            curl -s -X POST "$DEPLOY_HOOK_URL"
            echo "Deployment webhook triggered successfully."
          else
            echo "Notice: RENDER_DEPLOY_HOOK_URL secret not set. Skipping automated trigger step."
          fi
