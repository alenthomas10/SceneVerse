version: '3.8'

services:
  web:
    build:
      context: ./SceneVerse
      dockerfile: Dockerfile
    command: gunicorn SceneVerse.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-12345
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://sceneverse_user:sceneverse_pass@db:5432/sceneverse_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=sceneverse_db
      - POSTGRES_USER=sceneverse_user
      - POSTGRES_PASSWORD=sceneverse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
